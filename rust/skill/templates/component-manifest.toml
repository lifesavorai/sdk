# Component Manifest for Life Savor Developer Portal
# This file declares metadata about your component for marketplace listing and QA review.
# See: https://developer.stage.lifesavor.ai/docs/component-manifest

name = "my-skill"
type = "skill_provider"
version = "0.1.0"
description = "A Life Savor skill provider"
license = "MIT"

# Agent version compatibility range
# compatibility = ">=0.1.0"

# Marketplace tags for discoverability
# tags = ["skill", "utility"]

# Marketplace category
# category = "skill"

# --- Security-Relevant Fields ---
# These fields are reviewed during QA submission. Declare all access your component requires.

# vault_keys: Vault key names your component will request via CredentialManager.
# Only keys listed here can be resolved; others return AccessDenied.
# vault_keys = ["SKILL_API_KEY"]

# env_vars: Environment variables your component reads at runtime.
# Undeclared env var access is flagged as a sandbox violation.
# env_vars = ["HOME", "PATH"]

# filesystem_paths: Filesystem paths your component accesses.
# Access outside these paths is flagged as a sandbox violation.
# filesystem_paths = ["/tmp"]

# network_endpoints: External network endpoints your component connects to.
# network_endpoints = ["https://api.example.com"]

# max_output_bytes: Maximum output size in bytes (for sandbox enforcement).
# max_output_bytes = 1048576

# --- Status Badges ---
# Uncomment and replace "my-skill" with your component slug.
# [[badges]]
# badge_type = "build"
# url = "https://developer.stage.lifesavor.ai/badges/my-skill/build.svg"
#
# [[badges]]
# badge_type = "version"
# url = "https://developer.stage.lifesavor.ai/badges/my-skill/version.svg"
#
# [[badges]]
# badge_type = "installs"
# url = "https://developer.stage.lifesavor.ai/badges/my-skill/installs.svg"

# --- Upgrade Behavior ---
# Controls how the agent handles upgrades of your component.
# All fields are optional — the agent uses sensible defaults without this section.
# See: https://docs.lifesavor.ai/developer-tools/component-upgrades

# [upgrade]
# min_agent_version = "2.0.0"       # Minimum agent version required
# breaking = false                    # true = canary rollout (gradual deploy)
# notes = "Bug fixes and improvements"
# preserve_data = ["data/"]           # Directories preserved across upgrades
# required_agent_features = []        # Agent features your component needs

# [upgrade.health_check]
# type = "command"                    # "http", "command", "tcp", or "none"
# endpoint = "./scripts/health-check.sh"
# timeout_secs = 10
# retries = 3

# [upgrade.hooks]
# pre_upgrade = "scripts/pre-upgrade.sh"   # Runs before backup
# post_upgrade = "scripts/post-upgrade.sh" # Runs after install

# [[upgrade.migrations]]
# from = "1.*"                        # Glob: any 1.x source version
# to = "2.0.0"                        # Exact target version
# script = "migrations/v1_to_v2.sh"
# description = "Migrate config schema from v1 to v2"
# required = true                     # false = failure won't rollback

